[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ferneg1244-aligndisagree"
version = "0.1.0"
description = "统计各来源片段的贡献量与占比，标出对齐数据的标注分歧上最主要的来源"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ferneg1244" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://ferneg1244.github.io"
Repository = "https://github.com/ferneg1244/aligndisagree"
Issues = "https://github.com/ferneg1244/aligndisagree/issues"

[project.scripts]
aligndisagree = "aligndisagree:main"

[tool.setuptools]
py-modules = ["aligndisagree"]
